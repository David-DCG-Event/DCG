<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>經典一頁</title><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#080808;color:#dfbf72}*{box-sizing:border-box}body{margin:0;padding:clamp(18px,5vw,54px);min-height:100svh;display:grid;place-items:center}main{width:min(100%,960px)}header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}h1{font-size:16px;letter-spacing:.18em;font-weight:500;margin:0}.counter{font-size:12px;font-variant-numeric:tabular-nums;color:#bca369}.card{background:#0c0c0b;border:1px solid #3c321d;min-height:360px;aspect-ratio:2.15;display:flex;flex-direction:column;justify-content:center;padding:clamp(26px,6vw,66px)}blockquote{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:clamp(24px,3.6vw,36px);line-height:1.9;margin:0;overflow-wrap:anywhere;text-wrap:pretty}.author{text-align:right;font-size:16px;line-height:1.8;margin:28px 0 0;color:#c9aa65}.long{font-size:clamp(21px,2.8vw,28px)}nav{display:flex;justify-content:center;gap:14px;margin:24px 0}button,input,select{font:inherit;background:#12110d;color:#dfbf72;border:1px solid #5a4828;border-radius:4px;padding:12px 18px}button{cursor:pointer;touch-action:manipulation}button:hover{background:#252013}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #efce80;outline-offset:4px}nav button{min-width:125px}.sub{font-size:12px;color:#bca369;line-height:1.8}details{margin-top:18px;border-top:1px solid #302818;padding-top:15px}summary{cursor:pointer;font-size:12px;color:#bca369}a{color:#d6b972;text-underline-offset:4px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:20px 0}.controls label{display:flex;flex-direction:column;gap:6px;font-size:12px}input{width:100px}select{max-width:100%}#status{min-height:20px}#original{overflow-wrap:anywhere}#source p{line-height:1.8}#notes{font-size:12px;color:#bca369}#reload{display:none}[hidden]{display:none!important}@media(max-width:540px){.card{aspect-ratio:auto;min-height:330px;padding:26px}.author{font-size:14px}nav{gap:10px}nav button{flex:1;min-width:0}.counter{font-size:11px}.controls{align-items:stretch}.controls label{max-width:100%}}
</style></head><body><main><header><h1>經典一頁</h1><span id="counter" class="counter">1,000 則</span></header><article class="card" aria-live="polite" aria-atomic="true"><blockquote id="quote">正在載入語錄……</blockquote><p id="author" class="author"></p></article><nav aria-label="翻閱語錄"><button id="prev" disabled>← 上一張</button><button id="next" disabled>下一張 →</button></nav><p id="status" class="sub" role="status"></p><button id="reload" onclick="location.reload()">重新載入</button><details id="source"><summary>這句話的出處</summary><p id="work"></p><p id="original" class="sub"></p><p><a id="sourceLink" target="_blank" rel="noopener noreferrer">查看原文</a></p><p id="notes"></p></details><details><summary>找句子</summary><div class="controls"><label>選擇內容<select id="filter"><option value="all">全部 1,000 則</option><option>哲思與科學</option><option>儒家</option><option>唐詩</option><option>宋詞</option></select></label><label>跳至第幾張<input id="jump" type="number" min="1" max="1000" value="1"></label><button id="go">前往</button><button id="random">隨機一張</button></div><p class="sub">收錄語錄與經典摘句；外文附原文，中文為譯寫。下一張會隨機抽取不同句子；上一張可回看本次瀏覽過的句子。重新整理也會換一句，左右方向鍵同樣可用。</p><a class="sub" href="./quotes-sources.txt" target="_blank" rel="noopener">收錄範圍與資料來源</a></details></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='dcg-classics-v1';let all=[],list=[],at=0,trail=[];
function save(){try{localStorage.setItem(key,JSON.stringify({id:list[at].id,filter:$('filter').value}));}catch{}}
function render(){if(!list.length)return;const q=list[at];$('quote').textContent=q.text;$('quote').classList.toggle('long',q.text.length>60);$('author').textContent='《'+q.author+'》';$('counter').textContent=String(at+1).padStart(4,'0')+' / '+list.length.toLocaleString();$('work').textContent=q.work;$('original').textContent=q.original||'';$('original').hidden=!q.original;$('sourceLink').href=q.url;$('notes').textContent=q.note;$('source').open=false;$('jump').max=list.length;$('jump').value=at+1;$('prev').disabled=trail.length===0;$('next').disabled=list.length<2;save();}
function pick(exclude){const choices=list.map((q,i)=>i).filter(i=>list[i].id!==exclude);return choices.length?choices[Math.floor(Math.random()*choices.length)]:0;}
function visit(index){if(index!==at){trail.push(at);at=index;}$('status').textContent='';render();}
function next(){if(list.length>1)visit(pick(list[at].id));}
function previous(){if(trail.length){at=trail.pop();$('status').textContent='';render();}}
$('prev').onclick=previous;$('next').onclick=next;
$('filter').onchange=()=>{list=all.filter(q=>$('filter').value==='all'||q.group===$('filter').value);trail=[];at=pick();$('status').textContent='';render();};
$('go').onclick=()=>{const n=Number($('jump').value);if(!Number.isInteger(n)||n<1||n>list.length){$('status').textContent='請輸入 1 到 '+list.length+'。';return;}visit(n-1);};
$('random').onclick=next;
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.key==='ArrowLeft'?previous():next();}});
fetch('./quotes-data.json?v=1').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{if(!Array.isArray(data)||data.length!==1000)throw Error();all=data;let saved;try{saved=JSON.parse(localStorage.getItem(key));}catch{}if(saved&&[...$('filter').options].some(o=>o.value===saved.filter))$('filter').value=saved.filter;list=all.filter(q=>$('filter').value==='all'||q.group===$('filter').value);at=pick(saved?.id);render();}).catch(()=>{$('quote').textContent='暫時無法載入語錄，請重新整理。';$('reload').style.display='inline-block';$('source').hidden=true;});
})();</script></body></html>
