<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f7fc">
<title>計時與待辦</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#183d67;background:#f3f7fc;--blue:#2563ad;--muted:#58718c;--line:#d9e5f2}*{box-sizing:border-box}body{margin:0;padding:40px 20px 56px}main{max-width:760px;margin:auto}header{margin-bottom:26px}h1{font-size:28px;font-weight:650;letter-spacing:.06em;margin:0 0 10px}p{line-height:1.8}header p{margin:0;color:var(--muted);font-size:15px}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:1px solid var(--line);background:white;color:#244a73;border-radius:10px;padding:12px 20px}button:hover{background:#edf4fd}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #80b5ee;outline-offset:3px}input{min-width:0;color:inherit}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 8px 30px #19457405}.tabs{display:flex;background:#edf3fa;border-radius:12px;padding:5px;gap:5px;margin-bottom:24px}.tabs button{flex:1;border:0;background:transparent;font-weight:600;padding:12px 8px}.tabs button[aria-selected=true]{background:#fff;color:var(--blue);box-shadow:0 2px 8px #244a7310}.tab-state{display:block;font-size:11px;font-weight:400;min-height:16px;margin-top:3px}.session-label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}#sessionName{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:8px 0 12px;font-size:19px}#sessionName::placeholder{color:#8b9eb2}.clock-area{text-align:center;padding:28px 0 14px}.mode-caption{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}.clock{font-size:clamp(40px,9vw,76px);font-weight:500;line-height:1.2;letter-spacing:.025em;font-variant-numeric:tabular-nums;white-space:nowrap;color:#164778}.clock small{font-size:.35em;color:var(--muted);margin-left:4px}#clockStatus{font-size:14px;min-height:25px;margin:14px 0 4px;color:var(--muted)}.progress{height:4px;border-radius:8px;background:#edf3fa;overflow:hidden;margin:14px 0 28px}.progress span{display:block;background:#387bc6;height:100%;width:0;transition:width .2s}.duration{display:flex;justify-content:center;gap:16px;margin:8px 0 16px}.duration label{display:flex;flex-direction:column;gap:7px;text-align:center;font-size:13px;color:var(--muted)}.duration input{width:92px;max-width:100%;padding:10px;border:1px solid #c6d9ee;border-radius:9px;text-align:center;background:#f8fbff;font-size:21px;font-variant-numeric:tabular-nums}.presets{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 22px}.presets button{font-size:13px;padding:7px 14px}.actions{display:flex;justify-content:center;gap:12px;margin:20px 0 16px}.actions button{min-width:132px}.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.primary:hover{background:#194f92}.sound{display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;color:var(--muted)}input[type=checkbox]{accent-color:var(--blue);width:18px;height:18px;flex:none;cursor:pointer}.help{font-size:13px;color:var(--muted);margin:18px 0 0;text-align:center}#alert{margin:0 0 20px;padding:16px 18px;border:1px solid #a5c8ef;background:#eaf3ff;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}#alert button{font-size:13px;padding:8px 12px;flex-shrink:0}#message{font-size:14px;line-height:1.7;color:#9b3a38;margin:14px 0 0}#message:empty{display:none}.tasks-panel{margin-top:22px}.tasks-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.tasks-heading h2{font-size:20px;margin:0;font-weight:600}.count{font-size:13px;color:var(--muted)}.add-form{display:flex;gap:10px}.add-form input{flex:1;border:1px solid #c6d9ee;border-radius:10px;padding:12px 14px;background:#fbfdff}.add-form button{flex:none}#tasks{list-style:none;padding:0;margin:18px 0 0}.task{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e8eef6;padding:10px 0}.task input[type=text]{flex:1;width:100%;border:1px solid transparent;background:transparent;padding:10px 3px;border-radius:4px;font-size:16px}.task input[type=text]:hover{border-color:var(--line)}.task.done input[type=text]{color:#8193a7;text-decoration:line-through}.delete{border:0;background:transparent;font-size:13px;color:var(--muted);padding:10px}.delete:hover{color:#9b3a38;background:#fdf1f0}#empty{text-align:center;color:#7b90a5;padding:20px 0 8px;font-size:14px}.footnote{font-size:13px;color:var(--muted);margin:20px 0 0}.undo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px}.undo button{font-size:13px;padding:7px 12px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}[hidden]{display:none!important}@media(max-width:500px){body{padding:24px 12px 36px}.panel{padding:20px 16px;border-radius:16px}h1{font-size:25px}.duration{gap:12px}.duration input{width:76px}.actions button{min-width:0;flex:1}.add-form button{padding:12px}.clock-area{padding-top:25px}.task{gap:8px}.delete{padding:10px 6px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<header><h1>計時與待辦</h1><p>安排一段時間，把眼前的事慢慢做完。</p></header>
<div id="alert" role="status" hidden><span>時間到，這一段完成了。</span><button id="dismiss">知道了</button></div>
<section class="panel" aria-label="計時器">
<div class="tabs" role="tablist" aria-label="計時方式"><button id="countdownTab" role="tab" aria-selected="true" aria-controls="timerPanel">倒數計時<span id="countdownState" class="tab-state"></span></button><button id="stopwatchTab" role="tab" aria-selected="false" aria-controls="timerPanel" tabindex="-1">碼錶<span id="stopwatchState" class="tab-state"></span></button></div>
<div id="timerPanel" role="tabpanel" aria-labelledby="countdownTab">
<label class="session-label" for="sessionName">這次要做什麼？</label><input id="sessionName" maxlength="120" placeholder="例如：看書、練習機器人學、整理行李" autocomplete="off">
<div class="clock-area"><p id="modeCaption" class="mode-caption">倒數計時</p><div class="clock" role="timer" aria-live="off" aria-label="剩餘時間"><span id="clock">00:25:00</span><small id="fraction" hidden>.00</small></div><p id="clockStatus" role="status">準備好再開始</p></div>
<div id="progress" class="progress" aria-hidden="true"><span id="progressBar"></span></div>
<div id="countdownSettings"><div class="duration"><label for="hours">小時<input id="hours" type="number" min="0" max="99" step="1" value="0" inputmode="numeric"></label><label for="minutes">分鐘<input id="minutes" type="number" min="0" max="59" step="1" value="25" inputmode="numeric"></label><label for="seconds">秒<input id="seconds" type="number" min="0" max="59" step="1" value="0" inputmode="numeric"></label></div><div class="presets" aria-label="快速設定"><button data-minutes="5">5 分鐘</button><button data-minutes="25">25 分鐘</button><button data-minutes="50">50 分鐘</button></div></div>
<div class="actions"><button id="startPause" class="primary">開始計時</button><button id="reset">重設</button></div>
<label class="sound"><input id="sound" type="checkbox" checked>倒數結束時播放提示音</label>
<p class="help">切換模式不會中斷計時。提示音需保持頁面開啟，鎖屏或背景時可能延遲。</p><p id="message" role="status"></p>
</div></section>
<section class="panel tasks-panel" aria-labelledby="tasksTitle"><div class="tasks-heading"><h2 id="tasksTitle">待辦事項</h2><span id="taskCount" class="count">0 / 0 已完成</span></div>
<form id="addForm" class="add-form"><label class="sr-only" for="taskInput">新增待辦事項</label><input id="taskInput" placeholder="寫下一件要完成的事……" maxlength="300" autocomplete="off" required><button type="submit" class="primary">新增</button></form>
<ul id="tasks"></ul><p id="empty">清單還是空的，先寫下一件事吧。</p><div id="undo" class="undo" hidden><span role="status">已刪除一項待辦</span><button id="undoDelete">復原刪除</button></div><p class="footnote" id="storageNote">點文字可編輯。清單與計時進度保存在目前瀏覽器，不會跨裝置同步。</p>
</section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='dcg-timer-tasks-v1';
const freshClock=(total=0)=>({status:'idle',total,base:total,started:0});
let state={mode:'countdown',name:'',sound:true,tasks:[],countdown:freshClock(25*60000),stopwatch:freshClock()},deleted=null,audioContext=null,storageOK=true;
function validClock(c,kind){return c&&['idle','running','paused','done'].includes(c.status)&&Number.isFinite(c.total)&&c.total>=0&&c.total<=359999000&&Number.isFinite(c.base)&&c.base>=0&&Number.isFinite(c.started)&&c.started>=0&&(kind!=='countdown'||c.base<=c.total);}
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved){if(['countdown','stopwatch'].includes(saved.mode))state.mode=saved.mode;if(typeof saved.name==='string')state.name=saved.name.slice(0,120);state.sound=saved.sound!==false;for(const kind of ['countdown','stopwatch'])if(validClock(saved[kind],kind))state[kind]=saved[kind];if(Array.isArray(saved.tasks))state.tasks=saved.tasks.filter(t=>t&&typeof t.text==='string'&&t.text.trim()).slice(0,500).map(t=>({text:t.text.slice(0,300),done:!!t.done}));}}catch{storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}$('storageNote').textContent=storageOK?'點文字可編輯。清單與計時進度保存在目前瀏覽器，不會跨裝置同步。':'目前無法保存資料；請保持頁面開啟，關閉或重新整理後可能失去進度。';}
function amount(kind,now=Date.now()){const c=state[kind];const delta=c.status==='running'?Math.max(0,now-c.started):0;return kind==='countdown'?Math.max(0,c.base-delta):c.base+delta;}
function format(ms,ceil=false){const seconds=ceil?Math.ceil(ms/1000):Math.floor(ms/1000);return [Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':');}
function readDuration(){const values=['hours','minutes','seconds'].map(id=>$(id).value);const nums=values.map(v=>v.trim()===''?NaN:Number(v));if(nums.some(n=>!Number.isInteger(n)||n<0)||nums[0]>99||nums[1]>59||nums[2]>59){$('message').textContent='請輸入整數：小時 0～99，分鐘與秒數 0～59。';return null;}const total=(nums[0]*3600+nums[1]*60+nums[2])*1000;if(!total){$('message').textContent='請設定大於 0 秒的時間。';return null;}$('message').textContent='';return total;}
function setInputs(){const s=Math.floor(state.countdown.total/1000);$('hours').value=Math.floor(s/3600);$('minutes').value=Math.floor(s/60)%60;$('seconds').value=s%60;}
async function enableSound(){if(!state.sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!audioContext)audioContext=new Audio();if(audioContext.state==='suspended')await audioContext.resume();}catch{}}
function chime(){if(!state.sound||!audioContext||audioContext.state!=='running')return;try{for(let i=0;i<3;i++){const osc=audioContext.createOscillator(),gain=audioContext.createGain(),at=audioContext.currentTime+i*.35;osc.type='sine';osc.frequency.value=740;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.12,at+.025);gain.gain.exponentialRampToValueAtTime(.001,at+.24);osc.connect(gain);gain.connect(audioContext.destination);osc.start(at);osc.stop(at+.25);}}catch{}}
function finish(){const c=state.countdown;c.status='done';c.base=0;c.started=0;$('alert').hidden=false;save();renderControls();chime();}
function paint(){if(state.countdown.status==='running'&&amount('countdown')<=0)finish();const kind=state.mode,ms=amount(kind);$('clock').textContent=format(ms,kind==='countdown');$('fraction').textContent='.'+String(Math.floor(ms/10)%100).padStart(2,'0');const c=state.countdown;$('progressBar').style.width=(c.total?Math.min(100,100*(1-amount('countdown')/c.total)):0)+'%';for(const k of ['countdown','stopwatch'])$(k+'State').textContent=state[k].status==='running'?'進行中 · '+format(amount(k),k==='countdown'):state[k].status==='paused'?'已暫停':state[k].status==='done'?'已結束':'';document.title=(state[kind].status==='running'?format(ms,kind==='countdown')+' · ':'')+'計時與待辦';}
function renderControls(){const kind=state.mode,c=state[kind],countdown=kind==='countdown';for(const k of ['countdown','stopwatch']){$(k+'Tab').setAttribute('aria-selected',String(k===kind));$(k+'Tab').tabIndex=k===kind?0:-1;}$('timerPanel').setAttribute('aria-labelledby',kind+'Tab');$('countdownSettings').hidden=!countdown;$('progress').hidden=!countdown;$('fraction').hidden=countdown;$('modeCaption').textContent=countdown?'倒數計時':'碼錶';document.querySelector('.clock').setAttribute('aria-label',countdown?'剩餘時間':'經過時間');const locked=['running','paused'].includes(state.countdown.status);for(const el of document.querySelectorAll('.duration input,.presets button'))el.disabled=locked;$('startPause').textContent=c.status==='running'?'暫停':c.status==='paused'?'繼續':c.status==='done'?'再開始一次':countdown?'開始計時':'開始碼錶';$('clockStatus').textContent=c.status==='running'?'計時中':c.status==='paused'?'已暫停，可繼續或重設':c.status==='done'?'時間到，休息一下吧':'準備好再開始';}
function switchMode(kind){state.mode=kind;$('message').textContent='';save();renderControls();paint();}
for(const kind of ['countdown','stopwatch']){$(kind+'Tab').onclick=()=>switchMode(kind);$(kind+'Tab').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?'countdown':e.key==='End'?'stopwatch':kind==='countdown'?'stopwatch':'countdown';switchMode(next);$(next+'Tab').focus();}};}
$('startPause').onclick=()=>{const kind=state.mode,c=state[kind];if(c.status==='running'){const ms=amount(kind);if(kind==='countdown'&&ms<=0){finish();paint();return;}c.base=ms;c.started=0;c.status='paused';}else{if(kind==='countdown'&&c.status!=='paused'){const duration=readDuration();if(duration===null)return;c.total=duration;c.base=duration;$('alert').hidden=true;}if(kind==='stopwatch'&&c.status==='idle')c.base=0;c.started=Date.now();c.status='running';enableSound();}save();renderControls();paint();};
$('reset').onclick=()=>{const kind=state.mode;state[kind]=freshClock(kind==='countdown'?state.countdown.total:0);if(kind==='countdown'){setInputs();$('alert').hidden=true;}$('message').textContent='';save();renderControls();paint();};
for(const el of document.querySelectorAll('.duration input'))el.addEventListener('change',()=>{if(['running','paused'].includes(state.countdown.status))return;const total=readDuration();if(total!==null){state.countdown=freshClock(total);$('alert').hidden=true;save();renderControls();paint();}});
for(const b of document.querySelectorAll('.presets button'))b.onclick=()=>{state.countdown=freshClock(Number(b.dataset.minutes)*60000);setInputs();$('message').textContent='';$('alert').hidden=true;save();renderControls();paint();};
$('dismiss').onclick=()=>{$('alert').hidden=true;};$('sound').onchange=()=>{state.sound=$('sound').checked;save();if(state.sound)enableSound();};$('sessionName').oninput=()=>{state.name=$('sessionName').value;save();};
function updateCount(){$('taskCount').textContent=state.tasks.filter(t=>t.done).length+' / '+state.tasks.length+' 已完成';$('empty').hidden=state.tasks.length>0;}
function renderTasks(){$('tasks').replaceChildren();state.tasks.forEach((task,index)=>{const li=document.createElement('li');li.className='task'+(task.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=task.done;check.setAttribute('aria-label','完成：'+task.text);check.onchange=()=>{task.done=check.checked;li.classList.toggle('done',task.done);updateCount();save();};const text=document.createElement('input');text.type='text';text.maxLength=300;text.value=task.text;text.setAttribute('aria-label','待辦內容 '+(index+1));text.oninput=()=>{task.text=text.value;check.setAttribute('aria-label','完成：'+task.text);save();};text.onblur=()=>{if(!task.text.trim()){task.text='未命名待辦';text.value=task.text;check.setAttribute('aria-label','完成：'+task.text);save();}};const remove=document.createElement('button');remove.className='delete';remove.type='button';remove.textContent='刪除';remove.setAttribute('aria-label','刪除待辦 '+(index+1));remove.onclick=()=>{deleted={task:{...task},index};state.tasks.splice(index,1);$('undo').hidden=false;save();renderTasks();$('undoDelete').focus();};li.append(check,text,remove);$('tasks').append(li);});updateCount();}
$('addForm').onsubmit=e=>{e.preventDefault();const text=$('taskInput').value.trim();if(!text)return;if(state.tasks.length>=500){$('message').textContent='目前最多可保存 500 項待辦，請先整理清單。';return;}state.tasks.push({text,done:false});$('taskInput').value='';save();renderTasks();$('taskInput').focus();};
$('undoDelete').onclick=()=>{if(!deleted)return;state.tasks.splice(Math.min(deleted.index,state.tasks.length),0,deleted.task);deleted=null;$('undo').hidden=true;save();renderTasks();};
$('sessionName').value=state.name;$('sound').checked=state.sound;setInputs();renderTasks();renderControls();paint();if(!storageOK)$('storageNote').textContent='目前無法讀取已保存的資料；新的內容將嘗試保存在此瀏覽器。';setInterval(paint,60);document.addEventListener('visibilitychange',paint);window.addEventListener('pageshow',()=>{paint();});
})();
</script></body></html>
