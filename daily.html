:root{color-scheme:dark;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#dfbf72;background:#000000}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,660px);min-height:min(760px,calc(100svh - 48px));background:#000000;border:1px solid #342b18;padding:clamp(26px,6vw,60px);display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding-bottom:22px;border-bottom:1px solid #342b18}h1{font-size:15px;font-weight:500;letter-spacing:.16em;margin:0}time{font-size:12px;letter-spacing:.04em;color:#bca369;white-space:nowrap}.entry{flex:1;display:flex;flex-direction:column;justify-content:center;padding:58px 0 66px}.kind{font-size:11px;letter-spacing:.16em;color:#bca369;margin:0 0 22px}blockquote{margin:0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:clamp(25px,4.8vw,35px);line-height:1.95;font-weight:500;letter-spacing:.035em;overflow-wrap:anywhere;text-wrap:pretty}.credit{margin:27px 0 0;font-size:12px;line-height:1.8;color:#bca369}.credit a{color:inherit;text-decoration-color:#776335;text-underline-offset:4px}.credit a:focus-visible{outline:2px solid #dfbf72;outline-offset:5px}footer{display:flex;justify-content:flex-end;gap:16px;border-top:1px solid #342b18;padding-top:20px;color:#bca369;font-size:11px;letter-spacing:.08em}.credit[hidden]{display:none}@media(max-width:480px){body{padding:12px}main{min-height:calc(100svh - 24px)}header{gap:10px}time{font-size:11px}.entry{padding:46px 0}footer{font-size:10px}}
</style></head><body><main aria-label="今日一頁"><header><h1>今日一頁</h1><time id="date"></time></header><article class="entry" aria-live="polite" aria-atomic="true"><blockquote id="words"></blockquote><p id="credit" class="credit"></p></article><footer><span id="page"></span></footer><noscript>請開啟 JavaScript，顯示今天的字卡。</noscript></main>
<script id="pages" type="application/json">[{"text":"早餐店阿姨開始問「一樣嗎」，代表你最近吃得很固定。","kind":"日常小記","author":"","url":""},{"text":"今天先不要改變世界，先把充電線插好。","kind":"沒有重點","author":"","url":""},{"text":"最近哪一個瞬間，你沒有想著下一件事？","kind":"留個問題","author":"","url":""},{"text":"還沒想好，也可以先把鞋穿上，出去走一小段。","kind":"慢慢想","author":"","url":""},{"text":"洗完澡再決定要不要繼續煩惱。","kind":"日常小記","author":"","url":""},{"text":"我的人生方向很明確：晚餐的方向。","kind":"沒有重點","author":"","url":""},{"text":"如果今天只能留下一張照片，你會拍什麼？","kind":"留個問題","author":"","url":""},{"text":"行程留點空檔，不然連上廁所都要趕。","kind":"慢慢想","author":"","url":""},{"text":"有些日子沒有大事，只有晚餐剛好很好吃。","kind":"日常小記","author":"","url":""},{"text":"有朋自遠方來，不亦樂乎？","kind":"古人一句","author":"孔子 ·《論語・學而》","url":"https://ctext.org/analects/xue-er/zh"},{"text":"如果發呆也算旅行，我今天已經環遊世界。","kind":"沒有重點","author":"","url":""},{"text":"你上次笑到講不出話，是跟誰在一起？","kind":"留個問題","author":"","url":""},{"text":"你可以很在乎一件事，也可以今天先不處理它。","kind":"慢慢想","author":"","url":""},{"text":"走過同一條路，也可能在今天才看見那棵樹。","kind":"日常小記","author":"","url":""},{"text":"床沒有說話，但它的挽留非常具體。","kind":"沒有重點","author":"","url":""},{"text":"現在的生活裡，有哪件小事是以前的你很想要的？","kind":"留個問題","author":"","url":""},{"text":"朋友不一定有答案，但通常有意見。","kind":"慢慢想","author":"","url":""},{"text":"有些歌一聽就知道，自己年紀不小了。","kind":"日常小記","author":"","url":""},{"text":"有些問題睡一覺就好了，沒好的起床再說。","kind":"沒有重點","author":"","url":""},{"text":"今天聽到的聲音，哪一個讓你覺得舒服？","kind":"留個問題","author":"","url":""},{"text":"今天做不完的，先分清楚哪些真的不能拖。","kind":"慢慢想","author":"","url":""},{"text":"照片拍糊了先別刪，可能只有這張沒人閉眼。","kind":"日常小記","author":"","url":""},{"text":"今天的進度：成功把昨天變成前天。","kind":"沒有重點","author":"","url":""},{"text":"哪個朋友的口頭禪，你已經不小心學會了？","kind":"留個問題","author":"","url":""},{"text":"群組突然安靜，通常是大家都在上班。","kind":"慢慢想","author":"","url":""},{"text":"到家報個平安，免得朋友以為你搭車搭到別縣市。","kind":"日常小記","author":"","url":""},{"text":"錢沒有不見，它只是變成了我喜歡的形狀。","kind":"沒有重點","author":"","url":""},{"text":"如果替今天取一個片名，會叫什麼？","kind":"留個問題","author":"","url":""},{"text":"聚會最難的不是找餐廳，是有人願意先丟日期。","kind":"慢慢想","author":"","url":""},{"text":"下雨天最大的分歧：有人想出門，有人想取消。","kind":"日常小記","author":"","url":""},{"text":"我不是沒有計畫，我計畫等一下再計畫。","kind":"沒有重點","author":"","url":""},{"text":"最近有沒有一件事，你其實根本懶得解釋？","kind":"留個問題","author":"","url":""},{"text":"不喜歡的事情，說清楚比假裝沒事更需要練習。","kind":"慢慢想","author":"","url":""},{"text":"有些地方值得再去，單純因為上次沒吃到。","kind":"日常小記","author":"","url":""},{"text":"千里之行，始於足下。","kind":"古人一句","author":"老子 ·《道德經》第六十四章","url":"https://ctext.org/dao-de-jing/zh"},{"text":"人生偶爾需要留白，例如這句話後面。","kind":"沒有重點","author":"","url":""},{"text":"有沒有一個地方，你想再跟同一群人去一次？","kind":"留個問題","author":"","url":""},{"text":"發現走錯路就改，導航都不會叫你硬撐。","kind":"慢慢想","author":"","url":""},{"text":"外帶回家最長的路，是聞得到但還不能吃的那段。","kind":"日常小記","author":"","url":""},{"text":"冰箱的燈每次都亮，感覺它很期待我。","kind":"沒有重點","author":"","url":""},{"text":"如果今天不需要向任何人交代，你想怎麼過？","kind":"留個問題","author":"","url":""},{"text":"你不需要把每一次心情，都整理成一個道理。","kind":"慢慢想","author":"","url":""},{"text":"天氣不錯，適合曬衣服。也可以只是看看。","kind":"日常小記","author":"","url":""},{"text":"別人都在追夢，我先追快要關門的早餐店。","kind":"沒有重點","author":"","url":""},{"text":"最近有什麼東西，是你買了以後真的常常用的？","kind":"留個問題","author":"","url":""},{"text":"熟到可以各滑各的手機，也是一種聚會。","kind":"慢慢想","author":"","url":""},{"text":"桌面再亂，飲料的位置總是清得出來。","kind":"日常小記","author":"","url":""},{"text":"今天的問題：吸管到底算幾個洞？","kind":"沒有重點","author":"","url":""},{"text":"你有多久沒有試一種從沒吃過的東西？","kind":"留個問題","author":"","url":""},{"text":"喜歡的事情暫時做不好，還是可以繼續喜歡。","kind":"慢慢想","author":"","url":""},{"text":"帶了傘沒下雨，總比下雨才想起傘好。","kind":"日常小記","author":"","url":""},{"text":"這一頁沒有隱藏含義，字就只是待在這裡。","kind":"沒有重點","author":"","url":""},{"text":"哪一段共同回憶，每個人講出來都不一樣？","kind":"留個問題","author":"","url":""},{"text":"別急著替今天打分數，它可能只是很普通的一天。","kind":"慢慢想","author":"","url":""},{"text":"外套口袋找到一百元，今天的財務報表暫時好看一點。","kind":"日常小記","author":"","url":""},{"text":"我跟鬧鐘的關係，大概只能算互相傷害。","kind":"沒有重點","author":"","url":""},{"text":"今天的自己，有哪一點跟一年前不同？","kind":"留個問題","author":"","url":""},{"text":"沒聽懂就再問一次，亂點頭後面通常更麻煩。","kind":"慢慢想","author":"","url":""},{"text":"那家店換了招牌，你卻還是叫它以前的名字。","kind":"日常小記","author":"","url":""},{"text":"不患人之不己知，患不知人也。","kind":"古人一句","author":"孔子 ·《論語・學而》","url":"https://ctext.org/analects/xue-er/zh"},{"text":"早起不一定有蟲吃，但一定比較早餓。","kind":"沒有重點","author":"","url":""},{"text":"如果能寄一句話給下個月的自己，你會寫什麼？","kind":"留個問題","author":"","url":""},{"text":"記不得旅行日期，但記得那碗麵多少錢。","kind":"慢慢想","author":"","url":""},{"text":"散步沒有白走，至少知道哪一戶養了很吵的狗。","kind":"日常小記","author":"","url":""},{"text":"如果星期一有實體，我希望它是一顆馬鈴薯。","kind":"沒有重點","author":"","url":""},{"text":"你現在最想約誰吃一頓不用趕時間的飯？","kind":"留個問題","author":"","url":""},{"text":"有意見早點講，比結束後說「我早就覺得」有用。","kind":"慢慢想","author":"","url":""},{"text":"睡前再看一下手機，通常不只一下。","kind":"日常小記","author":"","url":""},{"text":"本日重要公告：公告結束。","kind":"沒有重點","author":"","url":""},{"text":"你喜歡某首歌，是因為旋律，還是因為那時候？","kind":"留個問題","author":"","url":""},{"text":"時間不會替你赴約，想見的人還是要自己問。","kind":"慢慢想","author":"","url":""},{"text":"公車剛好到站，今天少跑了一段。","kind":"日常小記","author":"","url":""},{"text":"剛剛想說一句很有智慧的話，現在只記得很有智慧。","kind":"沒有重點","author":"","url":""},{"text":"今天有什麼事，可以不用做到最好也沒關係？","kind":"留個問題","author":"","url":""},{"text":"點餐前先確認人數，不要用上次聚會的人數算。","kind":"慢慢想","author":"","url":""},{"text":"以前放學就能見到的人，現在約吃飯要開投票。","kind":"日常小記","author":"","url":""},{"text":"生活要有儀式感，所以我鄭重宣布：我要躺下了。","kind":"沒有重點","author":"","url":""},{"text":"哪個習慣看起來很小，卻讓你比較像自己？","kind":"留個問題","author":"","url":""},{"text":"說「我不知道」之後，談話有時才真的開始。","kind":"慢慢想","author":"","url":""},{"text":"走進便利商店只想買水，出來通常不只一瓶。","kind":"日常小記","author":"","url":""},{"text":"我不是拖延，我是在讓事情多醞釀一下。","kind":"沒有重點","author":"","url":""},{"text":"你最近一次說「下次吧」，心裡是真的想去嗎？","kind":"留個問題","author":"","url":""},{"text":"合照不用每個人都帥，有一個人特別好笑也行。","kind":"慢慢想","author":"","url":""},{"text":"衣服洗好了不代表事情結束，還有晾、收、摺。","kind":"日常小記","author":"","url":""},{"text":"知人者智，自知者明。","kind":"古人一句","author":"老子 ·《道德經》第三十三章","url":"https://ctext.org/dao-de-jing/zh"},{"text":"今天的幸運色是：不用自己洗的衣服的顏色。","kind":"沒有重點","author":"","url":""},{"text":"如果我們十年後再翻到這一頁，你想提醒大家什麼？","kind":"留個問題","author":"","url":""},{"text":"想法改了很正常，記得把行程表也一起改。","kind":"慢慢想","author":"","url":""},{"text":"吃飯先吃飯，訊息可以等咬完這口。","kind":"日常小記","author":"","url":""},{"text":"沒有什麼是一頓飯不能討論的，結論可以沒有。","kind":"沒有重點","author":"","url":""},{"text":"你能接受跟朋友出門，各自安靜多久？","kind":"留個問題","author":"","url":""},{"text":"問朋友近況以前，先確認自己有時間聽。","kind":"慢慢想","author":"","url":""},{"text":"有些店吃過一次就忘了，有些踩雷十年還在講。","kind":"日常小記","author":"","url":""},{"text":"雲沒有打卡，今天也有來上班。","kind":"沒有重點","author":"","url":""},{"text":"如果朋友替你寫使用說明，第一條會是什麼？","kind":"留個問題","author":"","url":""},{"text":"想記的事先寫下來，不要太相信自己的記憶力。","kind":"慢慢想","author":"","url":""},{"text":"沒拍照也沒差，吃到一半才想起來很正常。","kind":"日常小記","author":"","url":""},{"text":"這句話走到這裡，決定下班。","kind":"沒有重點","author":"","url":""},{"text":"最近誰幫過你一個小忙，你還沒跟他說謝謝？","kind":"留個問題","author":"","url":""},{"text":"今天這頁看完了，該做的事還是要做。","kind":"慢慢想","author":"","url":""}]</script>
<script>
(()=>{'use strict';
const pages=JSON.parse(document.getElementById('pages').textContent);
const dayMs=86400000,offset=8*3600000,start=Date.UTC(2026,8,29);
const $=id=>document.getElementById(id);let shown='',timer;
function render(now=new Date()){
 const taipei=new Date(now.getTime()+offset),stamp=taipei.toISOString().slice(0,10);
 if(stamp===shown)return;shown=stamp;
 const day=Date.parse(stamp+'T00:00:00Z'),index=((Math.floor((day-start)/dayMs)%pages.length)+pages.length)%pages.length,p=pages[index];
 $('date').dateTime=stamp;$('date').textContent=stamp.replaceAll('-','.')+' · '+['日','一','二','三','四','五','六'][taipei.getUTCDay()];
 $('words').textContent=p.text;$('credit').replaceChildren();$('credit').hidden=!p.url;
 if(p.url){const link=document.createElement('a');link.href=p.url;link.textContent='— '+p.author;link.target='_blank';link.rel='noopener noreferrer';link.title='查看原文出處';$('credit').append(link);}
 $('page').textContent=String(index+1).padStart(3,'0')+' / '+pages.length;
}
function refresh(){clearTimeout(timer);render();const now=Date.now();const next=(Math.floor((now+offset)/dayMs)+1)*dayMs-offset;timer=setTimeout(refresh,Math.min(next-now+100,60000));}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});window.addEventListener('pageshow',refresh);refresh();
})();
</script></body></html>
