<script id="pages" type="application/json">[{"text":"早餐店的阿姨記得你的餐點，也算一種被世界記住。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"今天先不要改變世界，先把充電線插好。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"最近哪一個瞬間，你沒有想著下一件事？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"還沒想好，也可以先把鞋穿上，出去走一小段。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"洗完澡、換上乾淨衣服，有時就是一天裡最好的重新開始。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"我的人生方向很明確：晚餐的方向。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"如果今天只能留下一張照片，你會拍什麼？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"不是每段空白都要補滿，有時它就是休息的位置。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"有些日子沒有大事，只有晚餐剛好很好吃。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"有朋自遠方來，不亦樂乎？","kind":"古人一句","author":"孔子 ·《論語・學而》","url":"https://ctext.org/analects/xue-er/zh"},{"text":"如果發呆也算旅行，我今天已經環遊世界。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"你上次笑到講不出話，是跟誰在一起？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"你可以很在乎一件事，也可以今天先不處理它。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"走過同一條路，也可能在今天才看見那棵樹。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"床沒有說話，但它的挽留非常具體。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"現在的生活裡，有哪件小事是以前的你很想要的？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"朋友不一定知道答案，但可以陪你把問題說完整。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"一首歌前奏才響，你就已經回到某一年。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"有些問題睡一覺就好了，沒好的起床再說。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"今天聽到的聲音，哪一個讓你覺得舒服？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"今天的力氣只有一點，就先做一點點。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"手機裡那張沒刪的模糊照片，可能比清楚的更像當時。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"今天的進度：成功把昨天變成前天。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"哪個朋友的口頭禪，你已經不小心學會了？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"有些告別很安靜，像某個群組再也沒有人問要不要出門。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"有人回你一句「到家說」，路就不只是回家的路。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"錢沒有不見，它只是變成了我喜歡的形狀。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"如果替今天取一個片名，會叫什麼？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"長大以後，相聚常常從一個人不怕麻煩地問日期開始。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"窗外下雨的時候，房間會暫時變成一座小島。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"我不是沒有計畫，我計畫等一下再計畫。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"你最近的「還好」，比較接近真的還好，還是不知道怎麼說？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"不喜歡的事情，說清楚比假裝沒事更需要練習。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"喜歡一個地方，有時只是因為那裡曾經坐著喜歡的人。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"千里之行，始於足下。","kind":"古人一句","author":"老子 ·《道德經》第六十四章","url":"https://ctext.org/dao-de-jing/zh"},{"text":"人生偶爾需要留白，例如這句話後面。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"有沒有一個地方，你想再跟同一群人去一次？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"有些路是走過才知道不適合，回頭也算有了方向。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"買回家的熱食，讓普通的塑膠袋看起來像一個好消息。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"冰箱的燈每次都亮，感覺它很期待我。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"如果今天不需要向任何人交代，你想怎麼過？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"你不需要把每一次心情，都整理成一個道理。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"今天的天空沒有特別安排，卻剛好很好看。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"別人都在追夢，我先追快要關門的早餐店。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"最近有什麼東西，是你買了以後真的常常用的？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"有些關係的默契，是不用把沉默急著填滿。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"把桌面清出一小塊，先讓這杯水有地方站。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"今天想通一件事：吸管真的有兩個洞嗎？","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"你有多久沒有試一種從沒吃過的東西？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"喜歡的事情暫時做不好，還是可以繼續喜歡。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"有些長大，發生在你終於記得帶傘的那天。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"這一頁沒有隱藏含義，字就只是待在這裡。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"哪一段共同回憶，每個人講出來都不一樣？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"別急著替今天打分數，它可能只是很普通的一天。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"久沒穿的外套口袋，偶爾會寄存去年的驚喜。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"我跟鬧鐘的關係，大概只能算互相傷害。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"今天的自己，有哪一點跟一年前不同？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"願意重新問一次，可能比急著給答案更靠近一個人。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"那家店換了招牌，你卻還是叫它以前的名字。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"不患人之不己知，患不知人也。","kind":"古人一句","author":"孔子 ·《論語・學而》","url":"https://ctext.org/analects/xue-er/zh"},{"text":"早起不一定有蟲吃，但一定比較早餓。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"如果能寄一句話給下個月的自己，你會寫什麼？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"紀念不一定很盛大，也可以只是記得那天吃了什麼。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"散步沒有白走，至少知道哪一戶養了很吵的狗。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"如果星期一有實體，我希望它是一顆馬鈴薯。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"你現在最想約誰吃一頓不用趕時間的飯？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"有些勇敢很小，小到只有自己知道剛才沒有逃開。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"晚上關燈以前，房間還替你留著一點今天。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"本日重要公告：公告結束。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"你喜歡某首歌，是因為旋律，還是因為那時候？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"時間不會替你赴約，想見的人還是要自己問。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"生活偶爾很溫柔，例如剛好趕上一班不用追的車。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"剛剛想說一句很有智慧的話，現在只記得很有智慧。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"今天有什麼事，可以不用做到最好也沒關係？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"想念有時沒有大場面，只是多買了一份才想起你不在。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"以前覺得無聊的日常，後來要約好久才能重來一次。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"生活要有儀式感，所以我鄭重宣布：我要躺下了。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"哪個習慣看起來很小，卻讓你比較像自己？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"說「我不知道」之後，談話有時才真的開始。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"便利商店的燈，照顧著很多還沒準備回家的人。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"我不是拖延，我是在讓事情多醞釀一下。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"你最近一次說「下次吧」，心裡是真的想去嗎？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"不要因為一張不好看的照片，就刪掉一整天的快樂。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"晾好的衣服被風吹動，像生活正在自己伸懶腰。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"知人者智，自知者明。","kind":"古人一句","author":"老子 ·《道德經》第三十三章","url":"https://ctext.org/dao-de-jing/zh"},{"text":"今天的幸運色是：不用自己洗的衣服的顏色。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"如果我們十年後再翻到這一頁，你想提醒大家什麼？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"有些事情隔了一陣子再看，會長出不一樣的意思。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"好好吃完一頓飯，也是一件完整的事。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"沒有什麼是一頓飯不能討論的，結論可以沒有。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"哪一種安靜，會讓你覺得有人陪？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"一個人的近況，通常比一句「最近怎樣」還要長。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"你以為忘記了，味道卻替你記得。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"雲沒有打卡，今天也有來上班。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"你希望朋友記得你的哪個樣子？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"把今天留下一點，不是為了證明，只是以後想看看。","kind":"慢慢想","author":"DCG 原創","url":""},{"text":"今天沒有拍照的那段時間，也確實活過。","kind":"日常小記","author":"DCG 原創","url":""},{"text":"這句話走到這裡，決定下班。","kind":"沒有重點","author":"DCG 原創","url":""},{"text":"今天有沒有一句謝謝，還放在心裡沒說？","kind":"留個問題","author":"DCG 原創","url":""},{"text":"這一頁會換掉，但你今天做過的事，不會因此沒發生。","kind":"慢慢想","author":"DCG 原創","url":""}]</script>
<script>
(()=>{'use strict';
const pages=JSON.parse(document.getElementById('pages').textContent);
const dayMs=86400000,offset=8*3600000,start=Date.UTC(2026,8,29);
const $=id=>document.getElementById(id);let shown='',timer;
function render(now=new Date()){
 const taipei=new Date(now.getTime()+offset),stamp=taipei.toISOString().slice(0,10);
 if(stamp===shown)return;shown=stamp;
 const day=Date.parse(stamp+'T00:00:00Z'),index=((Math.floor((day-start)/dayMs)%pages.length)+pages.length)%pages.length,p=pages[index];
 $('date').dateTime=stamp;$('date').textContent=stamp.replaceAll('-','.')+' · '+['日','一','二','三','四','五','六'][taipei.getUTCDay()];
 $('words').textContent=p.text;$('kind').textContent=p.kind;$('credit').replaceChildren();
 if(p.url){const link=document.createElement('a');link.href=p.url;link.textContent='— '+p.author;link.target='_blank';link.rel='noopener noreferrer';link.title='查看原文出處';$('credit').append(link);}else $('credit').textContent='— '+p.author;
 $('page').textContent=String(index+1).padStart(3,'0')+' / '+pages.length;
}
function refresh(){clearTimeout(timer);render();const now=Date.now();const next=(Math.floor((now+offset)/dayMs)+1)*dayMs-offset;timer=setTimeout(refresh,Math.min(next-now+100,60000));}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});window.addEventListener('pageshow',refresh);refresh();
})();
</script></body></html>
